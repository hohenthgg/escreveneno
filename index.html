<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4efe6">
  <title>escreveneno</title>
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #fffdf8;
      --text: #25221e;
      --muted: #746d63;
      --line: rgba(37, 34, 30, .14);
      --accent: #7b4b32;
      --font-size: 19px;
      --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: Georgia, "Times New Roman", serif;
    }

    body.dark {
      --bg: #151412;
      --paper: #1d1b18;
      --text: #e9e2d8;
      --muted: #aaa195;
      --line: rgba(233, 226, 216, .14);
      --accent: #d18a62;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      line-height: 1.7;
      text-rendering: optimizeLegibility;
      transition: background .2s ease, color .2s ease;
    }

    .progresso {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: 3px;
      background: transparent;
    }

    .progresso > span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    /* ---------- topo ---------- */

    .topo {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: max(11px, env(safe-area-inset-top)) clamp(16px, 4vw, 30px) 11px;
      background: rgba(244, 239, 230, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @supports (background: color-mix(in srgb, black 50%, transparent)) {
      .topo { background: color-mix(in srgb, var(--bg) 88%, transparent); }
    }

    .marca {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font: 700 16px/1.2 var(--serif);
      letter-spacing: .01em;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controles { display: flex; gap: 7px; }

    button {
      min-width: 40px;
      min-height: 38px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--text);
      font: 600 14px/1 var(--ui);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { border-color: var(--accent); }
    button:active { transform: scale(.97); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- lista ---------- */

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(28px, 6vw, 60px) clamp(20px, 5vw, 40px) max(80px, env(safe-area-inset-bottom));
    }

    .capa { margin-bottom: clamp(28px, 5vw, 44px); }

    .capa h1 {
      margin: 0;
      font: 700 clamp(30px, 7vw, 44px)/1.15 var(--serif);
      letter-spacing: -.015em;
    }

    .capa p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .abas {
      display: flex;
      flex: 1 1 auto;
      flex-wrap: wrap;
      gap: 7px;
    }

    .abas button {
      min-height: 34px;
      padding: 6px 13px;
      font: 600 13px/1 var(--ui);
      letter-spacing: .02em;
    }

    .abas button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--paper);
    }

    .abas .conta {
      margin-left: 6px;
      opacity: .6;
      font-variant-numeric: tabular-nums;
    }

    #busca {
      flex: 0 1 190px;
      min-width: 130px;
      min-height: 34px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--text);
      font: 14px/1.3 var(--ui);
    }

    .entradas {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .entradas li { border-bottom: 1px solid var(--line); }

    .entradas a {
      display: block;
      padding: clamp(22px, 4vw, 30px) 0;
      color: inherit;
      text-decoration: none;
    }

    .entradas a:hover h2 { color: var(--accent); }

    .kicker {
      margin: 0 0 9px;
      color: var(--muted);
      font: 600 11.5px/1.4 var(--ui);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .kicker .cat { color: var(--accent); }

    .entradas h2 {
      margin: 0 0 8px;
      font: 700 clamp(21px, 4vw, 26px)/1.25 var(--serif);
      letter-spacing: -.01em;
      transition: color .15s ease;
    }

    .resumo {
      margin: 0;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      color: var(--muted);
      font-size: 16.5px;
      line-height: 1.6;
    }

    .vazio {
      padding: 50px 0;
      color: var(--muted);
      text-align: center;
    }

    /* ---------- leitura ---------- */

    .voltar {
      display: inline-block;
      color: var(--muted);
      font: 600 13px/1 var(--ui);
      text-decoration: none;
    }

    .voltar:hover { color: var(--accent); }
    .voltar.rodape { margin-top: 56px; }

    #texto h1 {
      margin: 8px 0 26px;
      font: 700 clamp(27px, 6vw, 38px)/1.2 var(--serif);
      letter-spacing: -.015em;
    }

    #texto .kicker { margin-top: 22px; }

    #corpo {
      font-size: var(--font-size);
      line-height: 1.78;
      hyphens: none;
    }

    #corpo p {
      margin: 0 0 1.45em;
      overflow-wrap: break-word;
    }

    #corpo h2 {
      margin: 3em 0 1.35em;
      padding-top: 1.1em;
      border-top: 1px solid var(--line);
      color: var(--accent);
      font: 700 .77em/1.35 var(--ui);
      letter-spacing: .115em;
    }

    #corpo > :first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    #corpo a { color: var(--accent); }

    #aviso {
      padding: 60px 0;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      #corpo { line-height: 1.72; }
      #corpo h2 { margin-top: 2.2em; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }

    @media print {
      .topo, .progresso, .voltar, .filtros { display: none; }
      body { background: white; color: black; }
      main { width: 100%; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="progresso" aria-hidden="true"><span id="barra"></span></div>

  <header class="topo">
    <a class="marca" href="#/" id="marca">escreveneno</a>
    <div class="controles">
      <button id="menor" type="button" aria-label="Diminuir o texto">A−</button>
      <button id="maior" type="button" aria-label="Aumentar o texto">A+</button>
      <button id="tema" type="button" aria-label="Alternar modo claro e escuro">◐</button>
    </div>
  </header>

  <main>
    <p id="aviso">carregando…</p>

    <section id="lista" hidden>
      <div class="capa">
        <h1 id="site-titulo"></h1>
        <p id="site-descricao" hidden></p>
      </div>
      <div class="filtros">
        <nav class="abas" id="abas" aria-label="Categorias"></nav>
        <input id="busca" type="search" placeholder="Buscar nos textos" aria-label="Buscar nos textos">
      </div>
      <ol class="entradas" id="entradas"></ol>
      <p class="vazio" id="vazio" hidden></p>
    </section>

    <article id="texto" hidden>
      <a class="voltar" href="#/">← todos os textos</a>
      <p class="kicker" id="meta"></p>
      <h1 id="titulo"></h1>
      <div id="corpo"></div>
      <a class="voltar rodape" href="#/">← todos os textos</a>
    </article>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const guarda = {
        ler(chave) { try { return localStorage.getItem(chave); } catch { return null; } },
        gravar(chave, valor) { try { localStorage.setItem(chave, valor); } catch {} }
      };

      // ---------- preferências de leitura ----------

      const raiz = document.documentElement;
      const corpoDoc = document.body;
      const tamanhoSalvo = Number(guarda.ler('reader-font-size'));
      const temaSalvo = guarda.ler('reader-theme');

      if (tamanhoSalvo >= 16 && tamanhoSalvo <= 28) raiz.style.setProperty('--font-size', tamanhoSalvo + 'px');
      if (temaSalvo === 'dark' || (!temaSalvo && matchMedia('(prefers-color-scheme: dark)').matches)) {
        corpoDoc.classList.add('dark');
      }

      const redimensionar = (passo) => {
        const atual = parseFloat(getComputedStyle(raiz).getPropertyValue('--font-size')) || 19;
        const novo = Math.min(28, Math.max(16, atual + passo));
        raiz.style.setProperty('--font-size', novo + 'px');
        guarda.gravar('reader-font-size', String(novo));
      };

      $('menor').addEventListener('click', () => redimensionar(-1));
      $('maior').addEventListener('click', () => redimensionar(1));
      $('tema').addEventListener('click', () => {
        corpoDoc.classList.toggle('dark');
        guarda.gravar('reader-theme', corpoDoc.classList.contains('dark') ? 'dark' : 'light');
      });

      const progresso = () => {
        const limite = raiz.scrollHeight - innerHeight;
        const parte = limite > 0 ? Math.min(100, Math.max(0, scrollY / limite * 100)) : 0;
        $('barra').style.width = ($('texto').hidden ? 0 : parte) + '%';
      };
      addEventListener('scroll', progresso, { passive: true });
      addEventListener('resize', progresso, { passive: true });

      // ---------- dados ----------

      let dados = null;
      let categoriaAtiva = 'todos';

      const semTags = (html) => {
        const caixa = document.createElement('div');
        caixa.innerHTML = html;
        return (caixa.textContent || '').replace(/\s+/g, ' ').trim();
      };

      // o resumo ignora os títulos de seção: eles atrapalham a primeira frase
      const resumir = (html, limite = 210) => {
        const caixa = document.createElement('div');
        caixa.innerHTML = html;
        caixa.querySelectorAll('h1, h2, h3').forEach((h) => h.remove());
        const texto = (caixa.textContent || '').replace(/\s+/g, ' ').trim();
        return texto.length > limite ? texto.slice(0, limite).replace(/\s+\S*$/, '') + '…' : texto;
      };

      const minutos = (html) => Math.max(1, Math.round(semTags(html).split(/\s+/).length / 220));

      const dataBonita = (iso) => {
        const partes = String(iso || '').split('-');
        if (partes.length !== 3) return '';
        const data = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
        return isNaN(data) ? '' : data.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
      };

      const ordenados = () => dados.textos.slice().sort((a, b) => String(b.data).localeCompare(String(a.data)));

      // ---------- lista ----------

      const desenharAbas = () => {
        const usadas = dados.categorias.filter((cat) => dados.textos.some((t) => t.categoria === cat));
        const todas = [['todos', 'Tudo', dados.textos.length]].concat(
          usadas.map((cat) => [cat, cat, dados.textos.filter((t) => t.categoria === cat).length]));

        $('abas').innerHTML = '';
        // uma categoria só não merece abas — e some do fluxo para a busca não ficar solta
        $('abas').hidden = usadas.length < 2;
        if (usadas.length < 2) return;

        todas.forEach(([chave, rotulo, quantos]) => {
          const botao = document.createElement('button');
          botao.type = 'button';
          botao.textContent = rotulo;
          botao.setAttribute('aria-pressed', String(chave === categoriaAtiva));
          const conta = document.createElement('span');
          conta.className = 'conta';
          conta.textContent = quantos;
          botao.appendChild(conta);
          botao.addEventListener('click', () => {
            categoriaAtiva = chave;
            desenharAbas();
            desenharEntradas();
          });
          $('abas').appendChild(botao);
        });
      };

      const desenharEntradas = () => {
        const busca = $('busca').value.trim().toLowerCase();
        const visiveis = ordenados().filter((t) => {
          if (categoriaAtiva !== 'todos' && t.categoria !== categoriaAtiva) return false;
          if (!busca) return true;
          return (t.titulo + ' ' + semTags(t.html)).toLowerCase().includes(busca);
        });

        $('entradas').innerHTML = '';
        visiveis.forEach((t) => {
          const item = document.createElement('li');
          const elo = document.createElement('a');
          elo.href = '#/t/' + encodeURIComponent(t.id);

          const meta = document.createElement('p');
          meta.className = 'kicker';
          const partes = [];
          if (t.categoria) partes.push('<span class="cat">' + escapar(t.categoria) + '</span>');
          if (dataBonita(t.data)) partes.push(escapar(dataBonita(t.data)));
          partes.push(minutos(t.html) + ' min de leitura');
          meta.innerHTML = partes.join(' · ');

          const titulo = document.createElement('h2');
          titulo.textContent = t.titulo;

          const resumo = document.createElement('p');
          resumo.className = 'resumo';
          resumo.textContent = resumir(t.html);

          elo.append(meta, titulo, resumo);
          item.appendChild(elo);
          $('entradas').appendChild(item);
        });

        const vazio = visiveis.length === 0;
        $('vazio').hidden = !vazio;
        $('vazio').textContent = busca
          ? 'Nada encontrado para "' + $('busca').value.trim() + '".'
          : 'Nenhum texto por aqui ainda.';
      };

      const escapar = (texto) => String(texto)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      $('busca').addEventListener('input', desenharEntradas);

      // ---------- rotas ----------

      const mostrarLista = () => {
        document.title = dados.site.titulo || 'escreveneno';
        $('texto').hidden = true;
        $('lista').hidden = false;
        desenharAbas();
        desenharEntradas();
        progresso();
      };

      const mostrarTexto = (id) => {
        const t = dados.textos.find((item) => item.id === id);
        if (!t) { location.hash = '#/'; return; }

        document.title = t.titulo + ' — ' + (dados.site.titulo || 'escreveneno');
        const partes = [];
        if (t.categoria) partes.push('<span class="cat">' + escapar(t.categoria) + '</span>');
        if (dataBonita(t.data)) partes.push(escapar(dataBonita(t.data)));
        partes.push(minutos(t.html) + ' min de leitura');
        $('meta').innerHTML = partes.join(' · ');
        $('titulo').textContent = t.titulo;
        $('corpo').innerHTML = t.html;
        $('lista').hidden = true;
        $('texto').hidden = false;
        scrollTo(0, 0);
        progresso();
      };

      const rotear = () => {
        if (!dados) return;
        const rota = location.hash.replace(/^#\/?/, '');
        if (rota.startsWith('t/')) mostrarTexto(decodeURIComponent(rota.slice(2)));
        else mostrarLista();
      };

      addEventListener('hashchange', rotear);

      // ---------- carregar ----------

      fetch('dados/textos.json?v=' + Date.now(), { cache: 'no-store' })
        .then((resposta) => {
          if (!resposta.ok) throw new Error(resposta.status);
          return resposta.json();
        })
        .then((conteudo) => {
          dados = conteudo;
          dados.site = dados.site || {};
          dados.categorias = dados.categorias || [];
          dados.textos = dados.textos || [];

          const nome = dados.site.titulo || 'escreveneno';
          $('marca').textContent = nome;
          $('site-titulo').textContent = nome;
          if (dados.site.descricao) {
            $('site-descricao').textContent = dados.site.descricao;
            $('site-descricao').hidden = false;
          }
          $('aviso').hidden = true;
          rotear();
        })
        .catch(() => {
          $('aviso').textContent = 'Não consegui carregar os textos. Recarregue a página.';
        });
    })();
  </script>
</body>
</html>
